<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">在 Shadowrocket 中添加订阅</title>
  <desc id="desc">添加节点页面示意图，类型选择 Subscribe，并填写订阅地址和备注。</desc>
  <rect width="960" height="560" rx="28" fill="#f5f5f7"/>
  <text x="64" y="76" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#111827">3. 添加 Subscribe 订阅</text>
  <rect x="154" y="106" width="652" height="390" rx="28" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="190" y="155" font-family="system-ui, sans-serif" font-size="22" fill="#0a84ff">取消</text>
  <text x="480" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">添加节点</text>
  <text x="770" y="155" text-anchor="end" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0a84ff">完成</text>
  <path d="M190 180h580M190 254h580M190 328h580M190 402h580" stroke="#e5e7eb" stroke-width="2"/>
  <text x="190" y="226" font-family="system-ui, sans-serif" font-size="22" fill="#111827">类型</text>
  <rect x="575" y="193" width="174" height="44" rx="22" fill="#e8f3ff"/>
  <text x="662" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0a84ff">Subscribe</text>
  <text x="190" y="300" font-family="system-ui, sans-serif" font-size="22" fill="#111827">URL</text>
  <text x="748" y="300" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#6b7280">粘贴订阅链接</text>
  <text x="190" y="374" font-family="system-ui, sans-serif" font-size="22" fill="#111827">备注</text>
  <text x="748" y="374" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#6b7280">NEXORA</text>
  <text x="190" y="448" font-family="system-ui, sans-serif" font-size="22" fill="#111827">自动更新</text>
  <rect x="690" y="420" width="60" height="34" rx="17" fill="#34c759"/>
  <circle cx="733" cy="437" r="14" fill="#fff"/>
</svg>
