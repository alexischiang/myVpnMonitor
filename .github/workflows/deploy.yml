name: Deploy to VPS

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "npm ci failed on attempt $attempt; retrying in ${delay}s..."
            sleep "$delay"
          done

      - name: Build application and documentation
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/docs/index.html

      - name: Deploy application and documentation to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USER }}
          SOURCE: dist/
          TARGET: ${{ secrets.DEPLOY_PATH }}/dist/

      - name: Pull latest code and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            previous_sha=$(git rev-parse HEAD)
            git pull --ff-only origin production
            if ! node -e "require('js-yaml'); require('pg'); require('nodemailer')" || ! git diff --quiet "$previous_sha" HEAD -- package-lock.json; then
              for attempt in 1 2 3; do
                if npm ci --omit=dev --workspaces=false --prefer-offline --registry=https://registry.npmjs.org --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  exit 1
                fi
                delay=$((attempt * 30))
                echo "npm ci failed on attempt $attempt; retrying in ${delay}s..."
                sleep "$delay"
              done
            fi
            if [ -f dist/index.html ]; then
              touch dist/index.html
            fi
            xui_base_url=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(process.env.XUI_BASE_URL || '')")
            if [ -n "$xui_base_url" ]; then
              export XUI_BASE_URL="$xui_base_url"
              xui_service_env=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(process.env.XUI_SERVICE_URL || '')")
              xui_token_env=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(process.env.XUI_SERVICE_TOKEN || '')")
              redis_env=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(process.env.REDIS_URL || '')")
              export XUI_SERVICE_URL="${XUI_SERVICE_URL:-${xui_service_env:-http://127.0.0.1:3002}}"
              export XUI_SERVICE_TOKEN="${XUI_SERVICE_TOKEN:-${xui_token_env:-$(openssl rand -hex 32)}}"
              export REDIS_URL="${REDIS_URL:-${redis_env:-redis://127.0.0.1:6379}}"
              xui_database_url=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(process.env.XUI_DATABASE_URL || process.env.LOCAL_DATABASE_URL || process.env.DATABASE_URL || '')")
              export XUI_DATABASE_URL="${XUI_DATABASE_URL:-$xui_database_url}"
              if [ "$REDIS_URL" = "redis://127.0.0.1:6379" ] && ( ! command -v redis-cli > /dev/null 2>&1 || ! redis-cli ping > /dev/null 2>&1 ); then
                if ! command -v redis-server > /dev/null 2>&1 && command -v sudo > /dev/null 2>&1 && command -v apt-get > /dev/null 2>&1; then
                  sudo apt-get update -y && sudo apt-get install -y redis-server
                fi
                if command -v redis-server > /dev/null 2>&1 && ! redis-cli ping > /dev/null 2>&1; then
                  if command -v systemctl > /dev/null 2>&1; then sudo systemctl enable --now redis-server || true; fi
                  redis-server --daemonize yes || true
                fi
              fi
            fi
            xui_service_url=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(process.env.XUI_SERVICE_URL || '')")
            if [ -n "$xui_service_url" ]; then
              xui_service_host=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(new URL(process.env.XUI_SERVICE_URL).hostname)")
              if [ "$xui_service_host" = "127.0.0.1" ] || [ "$xui_service_host" = "localhost" ]; then
              if pm2 describe nexora-xui > /dev/null 2>&1; then
                pm2 restart nexora-xui --update-env
              else
                pm2 start xui-server.js --name nexora-xui
                  pm2 save
                fi
              fi
              xui_ready=false
              for attempt in $(seq 1 12); do
                if curl --fail --silent --max-time 5 "${xui_service_url%/}/health" > /dev/null; then
                  xui_ready=true
                  break
                fi
                sleep 5
              done
              if [ "$xui_ready" != "true" ]; then
                pm2 logs nexora-xui --lines 50 --nostream || true
                exit 1
              fi
            fi
            pm2 restart nexora --update-env
            for attempt in $(seq 1 12); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
                exit 0
              fi
              sleep 5
            done
            pm2 logs nexora --lines 50 --nostream
            exit 1
