name: Deploy to VPS

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "npm ci failed on attempt $attempt; retrying in ${delay}s..."
            sleep "$delay"
          done

      - name: Build application and documentation
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/docs/index.html

      - name: Deploy application and documentation to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USER }}
          SOURCE: dist/
          TARGET: ${{ secrets.DEPLOY_PATH }}/dist/

      - name: Pull latest code and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            previous_sha=$(git rev-parse HEAD)
            git pull --ff-only origin production
            if [ ! -d node_modules ] || ! git diff --quiet "$previous_sha" HEAD -- package-lock.json; then
              for attempt in 1 2 3; do
                if npm ci --omit=dev --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  exit 1
                fi
                delay=$((attempt * 30))
                echo "npm ci failed on attempt $attempt; retrying in ${delay}s..."
                sleep "$delay"
              done
            fi
            if [ -f dist/index.html ]; then
              touch dist/index.html
            fi
            pm2 restart nexora --update-env
