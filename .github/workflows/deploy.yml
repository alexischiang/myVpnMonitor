name: Deploy to VPS

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "npm ci failed on attempt $attempt; retrying in ${delay}s..."
            sleep "$delay"
          done

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html

      - name: Deploy application to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USER }}
          SOURCE: dist/
          TARGET: ${{ secrets.DEPLOY_PATH }}/dist/

      - name: Pull latest code and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            previous_sha=$(git rev-parse HEAD)
            git pull --ff-only origin production
            if ! node -e "require('js-yaml'); require('pg'); require('nodemailer')" || ! git diff --quiet "$previous_sha" HEAD -- package-lock.json; then
              for attempt in 1 2 3; do
                if npm ci --omit=dev --workspaces=false --prefer-offline --registry=https://registry.npmjs.org --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  exit 1
                fi
                delay=$((attempt * 30))
                echo "npm ci failed on attempt $attempt; retrying in ${delay}s..."
                sleep "$delay"
              done
            fi
            if [ -f dist/index.html ]; then
              touch dist/index.html
            fi
            # The 3x-ui service was removed; its billing state is imported by the app on startup.
            if pm2 describe nexora-xui > /dev/null 2>&1; then
              pm2 delete nexora-xui
              pm2 save
            fi
            # node-hub serves the machine/relay install commands and node configs from this checkout, so it
            # must restart with the new code too. Only hosts that already run it under pm2 are touched.
            if pm2 describe nexora-hub > /dev/null 2>&1; then
              pm2 restart nexora-hub --update-env
              node_hub_url=$(node -e "require('./env').loadLocalEnv(); process.stdout.write(process.env.NODE_HUB_URL || 'http://127.0.0.1:3003')")
              hub_ready=false
              for attempt in $(seq 1 12); do
                if curl --fail --silent --max-time 5 "${node_hub_url%/}/health" > /dev/null; then
                  hub_ready=true
                  break
                fi
                sleep 5
              done
              if [ "$hub_ready" != "true" ]; then
                pm2 logs nexora-hub --lines 50 --nostream || true
                exit 1
              fi
            fi
            pm2 restart nexora --update-env
            for attempt in $(seq 1 12); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
                pm2 save
                exit 0
              fi
              sleep 5
            done
            pm2 logs nexora --lines 50 --nostream
            exit 1
