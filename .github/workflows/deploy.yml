name: Deploy to VPS

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Deploy dist to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USER }}
          SOURCE: dist/
          TARGET: ${{ secrets.DEPLOY_PATH }}/dist/

      - name: Pull latest code and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            if [ -f data/alert-state.json ]; then
              cp data/alert-state.json /tmp/nexora-alert-state.json
            fi
            if git ls-files --error-unmatch data/alert-state.json >/dev/null 2>&1; then
              git checkout -- data/alert-state.json
            fi
            git pull --ff-only origin production
            mkdir -p data
            if [ -f /tmp/nexora-alert-state.json ]; then
              mv /tmp/nexora-alert-state.json data/alert-state.json
            fi
            npm ci --production
            if [ -f dist/index.html ]; then
              touch dist/index.html
            fi
            pm2 restart nexora --update-env
