<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">在 Shadowrocket 中选择节点并连接</title>
  <desc id="desc">Shadowrocket 首页示意图，突出节点选择、配置路由和连接开关。</desc>
  <rect width="960" height="560" rx="28" fill="#f5f5f7"/>
  <text x="64" y="76" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#111827">4. 选择节点并开启连接</text>
  <rect x="154" y="106" width="652" height="398" rx="28" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="190" y="158" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#111827">未连接</text>
  <rect x="686" y="126" width="82" height="44" rx="22" fill="#34c759"/>
  <circle cx="745" cy="148" r="18" fill="#fff"/>
  <path d="M190 190h578M190 282h578M190 374h578" stroke="#e5e7eb" stroke-width="2"/>
  <text x="190" y="232" font-family="system-ui, sans-serif" font-size="20" fill="#6b7280">节点</text>
  <text x="748" y="232" text-anchor="end" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827">香港 01　✓</text>
  <text x="190" y="326" font-family="system-ui, sans-serif" font-size="20" fill="#6b7280">全局路由</text>
  <text x="748" y="326" text-anchor="end" font-family="system-ui, sans-serif" font-size="22" fill="#111827">配置　›</text>
  <text x="190" y="418" font-family="system-ui, sans-serif" font-size="20" fill="#6b7280">连接状态</text>
  <circle cx="690" cy="412" r="8" fill="#34c759"/>
  <text x="748" y="420" text-anchor="end" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#34c759">VPN 已连接</text>
  <rect x="336" y="446" width="288" height="42" rx="21" fill="#e8f8ed"/>
  <text x="480" y="474" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#15803d">状态栏出现 VPN 标志</text>
</svg>
